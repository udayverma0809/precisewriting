<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{color-scheme:dark;--bg:#05060f;--gl:rgba(255,255,255,.07);--ln:rgba(255,255,255,.14);--tx:#eef0ff;--mu:#bcc3e6;--cy:#4de1ff;--vi:#a07bff;--ok:#45e0a8;--bad:#ff7a8a;

.sub{color:var(--mu);margin:14px 0 0;max-width:340px}
.pn{background:var(--gl);border:1px solid var(--ln);border-radius:24px;padding:clamp(18px,2.4vw,34px);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:100%;overflow-y:auto}
.big{font:500 clamp(19px,2vw,28px)/1.4 var(--hd);margin:0 0 16px}.big b{color:var(--cy);font-weight:500}

.row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:12px}

th{font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mu);font-weight:600}
td.x{color:var(--bad)}td.v{color:var(--ok);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.fc{display:block;width:100%;text-align:left;margin-top:12px;color:var(--tx);background:transparent;border:1px dashed var(--bad);border-radius:14px;padding:12px 16px;font:500 15.5px/1.5 var(--bd);cursor:pointer}
.fc small{display:block;font:600 11px var(--bd);letter-spacing:1.8px;text-transform:uppercase;color:var(--bad);margin-bottom:2px}
.fc.o{border:1px solid var(--ok);background:rgba(69,224,168,.1)}.fc.o small{color:var(--ok)}
.q{font:700 clamp(18px,1.9vw,25px)/1.35 var(--hd);margin:6px 0 14px}
.os{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qh{font:600 12px var(--bd);letter-spacing:2px;text-transform:uppercase;color:var(--vi)}
.opt{text-align:left;font:500 15px/1.4 var(--bd);color:var(--tx);background:rgba(255,255,255,.06);border:1px solid var(--ln);border-radius:12px;padding:13px 15px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--cy)}
.opt.r{border-color:var(--ok);background:rgba(69,224,168,.18)}.opt.w{border-color:var(--bad);background:rgba(255,122,138,.16)}
.fb{color:var(--mu);font-size:14px;margin:10px 0;min-height:22px}
.btn{font:600 14px var(--bd);padding:11px 22px;border-radius:12px;border:0;cursor:pointer;background:linear-gradient(90deg,var(--cy),var(--vi));color:#06081a}
.btn.g{background:var(--gl);color:var(--tx);border:1px solid var(--ln)}
.sc{text-align:center;padding:10px 0}.sc big{display:block;font:700 56px var(--hd);color:var(--cy)}
.hero{grid-column:1/-1}
.hero h1{font:700 clamp(50px,9.5vw,150px)/.95 var(--hd);letter-spacing:-3px;margin:8px 0 14px}
.hero p{color:var(--mu);font-size:clamp(16px,1.6vw,21px);max-width:540px;margin:0 0 22px}
.pr{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.pc{background:var(--gl);border:1px solid var(--ln);border-radius:16px;padding:11px 18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pc b{display:block;font:700 19px var(--hd)}.pc span{font-size:12.5px;color:var(--mu)}
#nav{position:fixed;left:5vw;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:5}
#nav button{width:46px;height:46px;border-radius:50%;border:1px solid var(--ln);background:var(--gl);color:var(--tx);font-size:20px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#nav button:hover{border-color:var(--cy)}
#hint{position:fixed;left:calc(5vw + 118px);bottom:calc(30px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--mu);z-index:5}
#fab{position:fixed;right:5vw;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:9;background:linear-gradient(90deg,var(--vi),var(--cy));color:#06081a;border:0;border-radius:99px;padding:13px 20px;font:700 14px var(--bd);cursor:pointer;box-shadow:0 8px 30px rgba(120,100,255,.45)}
#chat{position:fixed;right:5vw;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 28px));height:min(500px,calc(100% - 130px));z-index:9;display:none;flex-direction:column;background:rgba(10,12,30,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--ln);border-radius:20px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.6)}
#chat.on{display:flex}
.ch{padding:12px 16px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center}
.ch b{font:700 18px var(--hd)}.ch small{display:block;color:var(--mu);font-size:12px}.ch button{background:none;border:0;color:var(--mu);font-size:24px;cursor:pointer}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.m.b{background:rgba(255,255,255,.09);align-self:flex-start;border-bottom-left-radius:4px}
.m.u{background:var(--vi);color:#06081a;align-self:flex-end;border-bottom-right-radius:4px}
.cps{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}
.cps button{font:500 12.5px var(--bd);background:rgba(77,225,255,.1);color:var(--cy);border:1px solid rgba(77,225,255,.35);border-radius:99px;padding:6px 11px;cursor:pointer}
.in{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--ln)}
.in input{flex:1;min-width:0;background:rgba(255,255,255,.07);border:1px solid var(--ln);border-radius:12px;color:var(--tx);font:16px var(--bd);padding:10px 12px;outline:none}
.in input:focus{border-color:var(--cy)}
.in button{background:var(--cy);color:#06081a;border:0;border-radius:12px;padding:0 16px;font:700 14px var(--bd);cursor:pointer}.in button:disabled{opacity:.5}
.pb{margin-top:26px;display:flex;align-items:center;gap:14px}.pb i{flex:none;width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--cy),var(--vi));display:grid;place-items:center;color:#06081a;font:700 20px var(--hd);font-style:normal}.pb span{display:block;font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--mu);line-height:1.2}.pb b{font:700 22px var(--hd)}
@media(max-width:900px){.f{display:flex;flex-direction:column;align-items:stretch;gap:18px;padding:18px 6vw 96px}.pn,.pc,#nav button,#pp,header{backdrop-filter:none;-webkit-backdrop-filter:none}.pn{background:rgba(22,22,52,.82);box-shadow:none}.f>:first-child{margin-top:auto}.f>:last-child{margin-bottom:auto}.pn{max-height:none;overflow:visible}h1 b{background:none;-webkit-text-fill-color:var(--cy);color:var(--cy)}.row,.g6,.two,.os{grid-template-columns:1fr}.row{grid-auto-flow:row}#hint{display:none}h2{font-size:34px}#pp{display:none}}
*,*:before{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
body{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:manipulation}
.pn{background:rgba(14,15,42,.86)}
#fs{font:600 13px var(--bd);color:var(--tx);background:var(--gl);border:1px solid var(--ln);border-radius:99px;padding:.4em 1em;cursor:pointer;margin-right:10px}
@media(max-width:900px){#fs{display:none}}
@media(min-width:1100px){
header{padding:1vw 5vw 0}header b{font-size:max(20px,1.3vw)}#pp,#cn,#fs{font-size:max(15px,.95vw)}
body{font-size:max(20px,1.3vw)}
.f{grid-template-columns:minmax(28%,34%) 1fr;padding-bottom:max(96px,7.5vw)}
.tag{font-size:max(14px,.85vw)}h2{font-size:max(44px,4.4vw)}
.sub{font-size:max(18px,1.25vw);max-width:none}
.big{font-size:max(24px,2vw)}
.t{padding:1.3vw}.t b{font-size:max(22px,1.6vw)}.t span{font-size:max(18px,1.25vw)}
th{font-size:max(14px,.9vw)}th,td{padding:.7vw .8vw}td{font-size:max(18px,1.3vw)}
.chips span{font-size:max(16px,1.1vw);padding:.4vw 1.3vw}
.note{font-size:max(18px,1.25vw)}
.pn{padding:2.2vw 2.6vw}
.fc{font-size:max(19px,1.35vw);padding:1vw 1.3vw}.fc small{font-size:max(13px,.85vw)}
.q{font-size:max(24px,2vw)}.qh{font-size:max(14px,.9vw)}
.opt{font-size:max(19px,1.3vw);padding:1.1vw 1.3vw;min-height:4.2vw}
.fb{font-size:max(17px,1.15vw)}
.btn{font-size:max(18px,1.2vw);padding:.9vw 2vw}
.sc big{font-size:max(64px,5vw)}
.hero h1{font-size:max(90px,10vw)}.hero p{font-size:max(20px,1.7vw);max-width:48vw}
.pc{padding:1vw 1.5vw}.pc b{font-size:max(22px,1.6vw)}.pc span{font-size:max(15px,1vw)}
.pb b{font-size:max(24px,1.8vw)}.pb span{font-size:max(13px,.8vw)}.pb i{width:max(52px,3.4vw);height:max(52px,3.4vw);font-size:max(22px,1.6vw)}
#nav button{width:max(56px,3.6vw);height:max(56px,3.6vw);font-size:max(24px,1.8vw)}
#hint{left:calc(5vw + max(140px,8.4vw));bottom:calc(max(30px,2vw) + env(safe-area-inset-bottom,0px));font-size:max(15px,1vw)}
#fab{font-size:max(18px,1.2vw);padding:1vw 1.8vw}
#chat{width:min(34vw,640px);height:min(62vh,900px);bottom:calc(max(90px,6.4vw) + env(safe-area-inset-bottom,0px))}
.ch b{font-size:max(22px,1.5vw)}.ch small{font-size:max(14px,.9vw)}.m{font-size:max(18px,1.2vw)}
.in input{font-size:max(18px,1.2vw)}.in button{font-size:max(17px,1.1vw)}.cps button{font-size:max(15px,1vw)}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="bar"></div>
<header><b>Precise<i>.</i>Writing</b><span id="pp"></span><span><button id="fs" onclick="fs()">⛶ Full screen</button><span id="cn"></span></span></header>
<div id="stage"><div id="track"></div></div>
<div id="nav"><button id="pv" aria-label="Previous">←</button><button id="nx" aria-label="Next">→</button></div>
<div id="hint">Swipe, drag or use ← →</div>
<button id="fab" onclick="openChat()">✦ Ask Verba</button>
<div id="chat">
  <div class="ch"><div><b>Verba</b><small>Your English doubt-buster</small></div><button onclick="openChat()" aria-label="Close">×</button></div>
  <div id="msgs"><div class="m b">Hi, I’m Verba. Got a doubt in English, grammar or writing? Ask me, big or small.</div></div>
  <div class="cps" id="cps"></div>
  <form class="in" onsubmit="send(event)" action="javascript:void 0"><input id="q" placeholder="Type your doubt…" autocomplete="off"><button id="sb">Send</button></form>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const U="Uday Verma",V="Vandit",T="Tejasvi",D="Vaidehi",N="Vinay";
const EX=[["Which sentence is precise?",["Many students are of the opinion that exams are stressful.","It is the opinion of many students that exams are stressful.","Many students find exams stressful.","Exams are stressful for many of the students."],2,"It says the same thing in the fewest words."],
["An exam question says “Define precise writing”. How do you begin?",["With a long story","With a one-line definition","With the conclusion","With a list of examples"],1,"Answer first, then explain."],
["Which one is already precise?",["at the present time","in order to","soon","due to the fact that"],2,"“Soon” is short and clear. The others can be trimmed."],
["How should a result be given in a report?",["With emotional words","With long sentences","With many adjectives","With exact numbers and dates"],3,"Facts and figures make writing exact."]];
const Q1=[["Which line best describes precise writing?",["Using big, impressive words","Saying exactly what you mean in as few words as needed","Being as short as possible, even if facts go missing","Repeating key points for emphasis"],1,"Exact and complete, without extra words."],["Why do reports need precise writing?",["Readers are busy and need facts fast","It makes the report look longer","It hides weak points","Teachers like hard language"],0,"Reports are read to take decisions."],["Which is NOT a feature of precise writing?",["Clear","Exact","Padded with extra words","Brief"],2,"Padding adds words without adding meaning."]];
const Q2=[["Best short replacement for “due to the fact that”?",["because","therefore","while","so that"],0,"The long phrase simply means “because”."],["Which phrase repeats an idea?",["clear summary","short note","final conclusion","main point"],2,"A conclusion is always final."],["What does the delete test ask?",["Can I remove a word without changing the meaning?","Is the word long?","Is the word difficult?","Is the word new?"],0,"If the meaning stays the same, the word was clutter."]];
const Q3=[["Which sentence is in active voice?",["The report was written by Tejasvi.","Tejasvi wrote the report.","The report has been written.","The report is being written."],1,"The doer comes first and does the action."],["Strongest replacement for “make a decision”?",["take a decision on","come to a decision","decide","be deciding"],2,"One strong verb, one word."],["Which sentence uses a strong verb?",["We had a discussion about it.","We discussed it.","We made a discussion of it.","We were in discussion on it."],1,"“Discussed” replaces “had a discussion”."]];
const Q4=[["Which sentence is more precise?",["Sales went up quite a lot recently.","Sales were doing really well.","Sales became good lately.","Sales rose 12% in March."],3,"Exact figures and time make it precise."],["What should you do before you start writing?",["Pick difficult words","Decide reader and purpose","Copy an old report","Write the conclusion first"],1,"Know who reads and why."],["Where should the main point go in a report?",["At the very end","In the middle","At the start","Nowhere, readers can guess"],2,"Point first, details later."]];
const ALL=[Q1,Q2,Q3,Q4,EX].flat();
const tip="Tap the card to see the precise version.";
const F=[
{k:"hero"},
{p:U,tag:"Introduction",t:"Why <b>precise</b> writing?",w:["precise","clear","reader","report"],sub:"Five minutes to see why short and exact beats long and foggy.",h:`<div class="row"><div class="t"><b>Busy readers</b><span>A manager decides in seconds if a report is worth reading.</span></div><div class="t"><b>Fewer mistakes</b><span>Exact words are hard to misread.</span></div><div class="t"><b>More trust</b><span>Clear writing shows clear thinking.</span></div></div><p class="note">Used in reports, emails, meeting minutes and exam answers.</p>`},
{p:U,tag:"Topic 01",t:"What is <b>precise</b> writing?",w:["precise","clear","brief","exact"],h:`<p class="big">Saying your <b>exact meaning</b> in the <b>fewest suitable words</b>.</p><div class="chips"><span>Clear</span><span>Brief</span><span>Exact</span></div><table><tr><th>Style</th><th>Example</th><th>Verdict</th></tr><tr><td>Wordy</td><td>It has come to our notice that sales for the month of March increased by 12 percent.</td><td class="x">Too many words</td></tr><tr><td>Vague</td><td>Sales went up quite a lot.</td><td class="x">No exact fact</td></tr><tr><td>Too short</td><td>Sales up.</td><td class="x">Time and amount missing</td></tr><tr><td>Precise</td><td>Sales rose 12% in March.</td><td class="v">Complete and exact</td></tr></table>`},
{p:U,tag:"Topic 01",t:"Where we <b>use</b> it",w:["report","summary","reader","purpose"],sub:"Five places precise writing pays off.",h:`<table><tr><th>Where</th><th>How to be precise</th></tr><tr><td>Business report</td><td>Findings and numbers first, background later.</td></tr><tr><td>Email</td><td>Clear subject line, one request per email.</td></tr><tr><td>Meeting minutes</td><td>Who will do what, and by when.</td></tr><tr><td>Executive summary</td><td>Purpose, main finding and action in 3 to 4 lines.</td></tr><tr><td>Exam answer</td><td>Direct points, no padding.</td></tr></table>`},
{p:U,tag:"Topic 01 · Quiz",t:"Quick <b>quiz</b>",w:["precise","clear","brief","exact"],sub:"3 questions · 1.5 minutes",q:Q1},
{p:V,tag:"Topic 02",t:"Cut the <b>clutter</b>",w:["clutter","trim","delete","brief"],sub:"Three habits that make writing heavy.",h:`<div class="row"><div class="t"><b><em>1</em>Long phrases</b><span>“in order to” becomes “to”.</span></div><div class="t"><b><em>2</em>Doubled words</b><span>“free gift”, “final conclusion”, “past history”.</span></div><div class="t"><b><em>3</em>Empty openers</b><span>“It is important to note that…” Start with the point.</span></div></div><p class="note"><b>The delete test:</b> remove a word. If the meaning stays, it was clutter.</p>`},
{p:V,tag:"Topic 02",t:"Word <b>swaps</b>",w:["because","now","trim","simple"],h:`<table><tr><th>Wordy</th><th>Precise</th></tr><tr><td class="x">due to the fact that</td><td class="v">because</td></tr><tr><td class="x">at this point in time</td><td class="v">now</td></tr><tr><td class="x">in the event that</td><td class="v">if</td></tr><tr><td class="x">a large number of</td><td class="v">many</td></tr><tr><td class="x">in spite of the fact that</td><td class="v">although</td></tr></table>`,c:[["It is important to note that the final conclusion was that we need advance planning.","The study concludes that we must plan ahead."]]},
{p:V,tag:"Topic 02",t:"Tighten these <b>lines</b>",w:["trim","clutter","delete","plain"],sub:"Try it yourself first, then tap the card.",h:`<p class="note" style="margin:0">${tip}</p>`,c:[["Due to the fact that it rained, the match was postponed to a later date.","Rain postponed the match."],["Students who are late should submit a written letter in writing.","Late students should submit a letter."],["A large number of employees are of the opinion that meetings are too long.","Many employees think meetings are too long."]]},
{p:V,tag:"Topic 02 · Quiz",t:"Quick <b>quiz</b>",w:["clutter","trim","because"],sub:"3 questions · 1.5 minutes",q:Q2},
{p:T,tag:"Topic 03",t:"Active vs <b>passive</b>",w:["active","passive","verb","voice"],sub:"Put the doer first.",h:`<div class="two"><div class="t"><b>Passive</b><span>The budget was approved by the manager.</span></div><div class="t"><b>Active</b><span>The manager approved the budget.</span></div></div><p class="big" style="font-size:clamp(16px,1.6vw,21px)">Active = <b>doer + action + receiver</b></p><p class="note">Passive is fine when the doer is unknown or unimportant: “The office was closed.”</p>`},
{p:T,tag:"Topic 03",t:"Strong <b>words</b>",w:["strong","decide","explain","verb"],h:`<table><tr><th>Weak</th><th>Strong</th></tr><tr><td class="x">make a decision</td><td class="v">decide</td></tr><tr><td class="x">give an explanation of</td><td class="v">explain</td></tr><tr><td class="x">carry out an inspection of</td><td class="v">inspect</td></tr><tr><td class="x">very big</td><td class="v">huge</td></tr></table>`,c:[["The results were very good and really nice.","Test scores rose from 62% to 78%."]]},

function mix(){return ALL.slice().sort(()=>Math.random()-.5).slice(0,6).map(([q,o,a,e])=>{const m=o.map((x,i)=>[x,i]).sort(()=>Math.random()-.5);return[q,m.map(x=>x[0]),m.findIndex(x=>x[1]===a),e]})}
function quiz(el,gen){
  let qs=gen(),i=0,sc=0;
  const show=()=>{
    if(i>=qs.length){el.innerHTML=`<div class="qh">Quiz complete</div><div class="sc"><big>${sc}/${qs.length}</big>${sc===qs.length?"Perfect score!":sc>=qs.length*.6?"Good job. Revise the missed points.":"Nice try. Review and try again."}</div>`;const b=document.createElement("button");b.className="btn g";b.textContent="Try again";b.onclick=()=>{qs=gen();i=0;sc=0;show()};el.appendChild(b);return}
    const [q,o,a,e]=qs[i];
    el.innerHTML=`<div class="qh">Question ${i+1} of ${qs.length}</div><div class="q"></div><div class="os"></div><div class="fb"></div>`;
    el.querySelector(".q").textContent=q;
    o.forEach((x,k)=>{const b=document.createElement("button");b.className="opt";b.textContent=x;b.onclick=()=>{
      el.querySelectorAll(".opt").forEach((y,j)=>{y.disabled=true;if(j===a)y.classList.add("r")});
      if(k===a)sc++;else b.classList.add("w");
      el.querySelector(".fb").textContent=(k===a?"Correct! ":"Not quite. ")+e;
      const n=document.createElement("button");n.className="btn";n.textContent=i+1<qs.length?"Next →":"See score";n.onclick=()=>{i++;show()};el.appendChild(n)};
      el.querySelector(".os").appendChild(b)});
  };show();
}
/* build frames */
const tr=$("track");let cur=0,drag=0;
F.forEach(f=>{
  const d=document.createElement("section");d.className="f";

  else if(f.k==="end"){d.innerHTML=`<div class="hero"><div class="tag">The end</div><h1><b>Thank you</b></h1><p>Any questions? Ask us, or ask Verba any English doubt right now.</p><button class="btn" onclick="openChat()">✦ Ask Verba</button><div class="pr"><div class="pc"><b>${U}</b></div><div class="pc"><b>${V}</b></div><div class="pc"><b>${T}</b></div><div class="pc"><b>${D}</b></div><div class="pc"><b>${N}</b></div></div></div>`}

    const p=d.querySelector(".pn");p.innerHTML=f.h||"";
    (f.c||[]).forEach(([b,a])=>{const r=document.createElement("button");r.className="fc";let o=0;const paint=()=>{r.classList.toggle("o",o);r.innerHTML=`<small>${o?"Precise":"Before"}</small>`;r.appendChild(document.createTextNode(o?a:b))};r.onclick=()=>{o=!o;paint()};paint();p.appendChild(r)});
    if(f.q){quiz(p,f.q==="mix"?mix:()=>f.q)}
  }
  tr.appendChild(d);
});
const frames=[...tr.children];
function pos(){tr.style.transform=`translate3d(${-cur*stg.clientWidth+drag}px,0,0)`}
addEventListener("resize",()=>{tr.classList.add("d");pos();requestAnimationFrame(()=>tr.classList.remove("d"))});
function go(i){
  const n=Math.max(0,Math.min(F.length-1,i)),dir=n>cur?1:n<cur?-1:0;cur=n;drag=0;tr.classList.remove("d");pos();
  frames.forEach((x,k)=>{x.classList.toggle("on",k===cur);x.style.visibility=Math.abs(k-cur)<=1?"visible":"hidden"});
  $("bar").style.width=((cur+1)/F.length*100)+"%";$("cn").textContent=(cur+1)+" / "+F.length;
  const f=F[cur];$("pp").innerHTML=f.p?"Presenter · <b>"+f.p+"</b>":"Group presentation";
  $("pv").style.opacity=cur?1:.3;$("nx").style.opacity=cur<F.length-1?1:.3;
  if(window.galaxyTo)window.galaxyTo(f.w||[],dir);
}
$("pv").onclick=()=>go(cur-1);$("nx").onclick=()=>go(cur+1);
function fs(){const d=document.documentElement;if(document.fullscreenElement){document.exitFullscreen()}else if(d.requestFullscreen){d.requestFullscreen()}}
addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1);if(e.key==="f"||e.key==="F")fs()});
/* swipe / drag: frames follow the finger */
const stg=$("stage");let sx=0,sy=0,dn=false,lk=0,nc=false,raf=0;const TH=innerWidth>=1100?26:10;
stg.addEventListener("pointerdown",e=>{if(e.target.closest("input,textarea"))return;dn=true;lk=0;sx=e.clientX;sy=e.clientY});
addEventListener("pointermove",e=>{
  if(!dn)return;const dx=e.clientX-sx,dy=e.clientY-sy;
  if(!lk){if(Math.abs(dx)>TH&&Math.abs(dx)>Math.abs(dy)*1.4){lk=1;tr.classList.add("d")}else if(Math.abs(dy)>TH+2){lk=2;dn=false}}
  if(lk===1){const edge=(cur===0&&dx>0)||(cur===F.length-1&&dx<0);drag=edge?dx*.25:dx;if(!raf){raf=requestAnimationFrame(()=>{raf=0;pos();if(window.galaxyDrag)window.galaxyDrag(drag)})}}
});
addEventListener("pointerup",e=>{
  if(!dn)return;dn=false;if(raf){cancelAnimationFrame(raf);raf=0}if(lk!==1)return;nc=true;setTimeout(()=>nc=false,60);
  const dx=e.clientX-sx;tr.classList.remove("d");if(window.galaxyDrag)window.galaxyDrag(0);
  if(Math.abs(dx)>Math.min(160,innerWidth*.12))go(cur+(dx<0?1:-1));else{drag=0;pos()}
});
addEventListener("click",e=>{if(nc){e.stopPropagation();e.preventDefault()}},true);

/* 3D galaxy of floating words */
function galaxy(){
  const mob=innerWidth<900,big=innerWidth>=1600,lite=mob||big,R=new THREE.WebGLRenderer({canvas:$("bg"),antialias:!lite,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,mob?1.25:big?1:1.5));
  const SC=new THREE.Scene(),C=new THREE.PerspectiveCamera(60,1,.1,100);C.position.set(0,2.4,9);
  const G=new THREE.Group();G.rotation.x=.18;SC.add(G);
  const arm=(i,n,rmin,rmax,sp)=>{const r=rmin+Math.pow(Math.random(),.8)*(rmax-rmin),a=(i%3)*2.094+r*.55+(Math.random()-.5)*sp;return[Math.cos(a)*r,(Math.random()-.5)*(1.2+r*.08),Math.sin(a)*r]};
  const dot=document.createElement("canvas");dot.width=dot.height=64;const dg=dot.getContext("2d"),gr=dg.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,"rgba(255,255,255,1)");gr.addColorStop(1,"rgba(255,255,255,0)");dg.fillStyle=gr;dg.fillRect(0,0,64,64);
  const dtex=new THREE.CanvasTexture(dot);
  function pts(n,size,col,op,add,spread){const p=new Float32Array(n*3);for(let i=0;i<n;i++){const v=arm(i,n,.5,11,spread);p.set(v,i*3)}const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(p,3));G.add(new THREE.Points(g,new THREE.PointsMaterial({map:dtex,size,color:col,transparent:true,opacity:op,depthWrite:false,blending:add?THREE.AdditiveBlending:THREE.NormalBlending})))}
  pts(lite?(mob?1200:1500):2400,big?.13:.09,0xdfe6ff,.85,0,1.1);pts(lite?(mob?160:200):500,.9,0x7b5cff,.16,1,1.6);pts(lite?(mob?90:110):260,.7,0x2fd2ff,.12,1,1.8);
  const WORDS="precise clear brief exact concise active passive verb noun report summary draft edit proofread tone grammar comma sentence paragraph reader purpose facts numbers because now decide explain inspect delete clutter trim strong weak vague simple plain direct logic voice adjective subject object clause idiom spelling margin title heading findings conclusion style recap exam writing".split(" ");
  const S=WORDS.map((w,i)=>{const k=document.createElement("canvas");k.width=256;k.height=64;const x=k.getContext("2d");x.font="700 36px 'Space Grotesk',sans-serif";x.textAlign="center";x.fillStyle="#fff";x.fillText(w,128,44);
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(k),transparent:true,depthWrite:false,color:0xa9a4ff,opacity:.4}));
    const v=arm(i,0,1.8,9,.9);s.position.set(v[0],v[1]*1.4,v[2]);s.userData={w,k:1,tk:1,o:.4};G.add(s);return s});
  let ry=0,ro=0,mx=0;
  addEventListener("pointermove",e=>{mx=e.clientX/innerWidth-.5});
  window.galaxyDrag=dx=>{ro=dx/innerWidth*.9};
  window.galaxyTo=(ws,dir)=>{ry-=dir*.75;S.forEach(s=>{const m=ws.includes(s.userData.w);s.userData.tk=m?2.3:1;s.userData.o=m?1:.4;s.material.color.set(m?0x4de1ff:0xa9a4ff)})};
  function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix()}
  addEventListener("resize",size);size();
  const slow=matchMedia("(prefers-reduced-motion: reduce)").matches?.2:1;let last=0;
  (function loop(t){
    const dt=Math.min((t-last)/1000||0,.05);last=t;
    ry+=dt*.03*slow;G.rotation.y+=((ry+ro)-G.rotation.y)*.05;
    C.position.x+=(mx*1.6-C.position.x)*.03;C.lookAt(0,0,0);
    S.forEach(s=>{const u=s.userData;u.k+=(u.tk-u.k)*.08;s.scale.set(1.7*u.k,.43*u.k,1);s.material.opacity+=(u.o-s.material.opacity)*.08});
    R.render(SC,C);requestAnimationFrame(loop);
  })(0);
  window.galaxyTo(F[cur].w||[],0);
}

/* Verba */
const chat=$("chat"),msgs=$("msgs"),qi=$("q"),cps=$("cps");
let hist=[],busy=false,sample=null,tried=false;
["When do I use ‘who’ and ‘whom’?","Explain active and passive voice","Make this shorter: ‘in spite of the fact that it rained’","Difference between ‘affect’ and ‘effect’"].forEach(t=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>{qi.value=t;send()};cps.appendChild(b)});
function openChat(){chat.classList.toggle("on");if(chat.classList.contains("on")){setTimeout(()=>qi.focus(),50);getSample()}}
async function getSample(){if(tried)return;tried=true;try{sample=await claude.use("sample")}catch(e){sample=null}}
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"),fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
function add(c,t){const d=document.createElement("div");d.className="m "+c;d.innerHTML=fmt(t);msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d}
const SYS=`You are Verba, a friendly English tutor inside a college group presentation on "Precise Writing" (report writing). Help students with English vocabulary, grammar, punctuation, sentence making, paragraph and report writing, precise and concise writing, and general writing skills.
Rules: Use simple, easy language, like a kind senior explaining to a friend. Keep replies short (3 to 7 lines) unless the student asks for detail. Give the rule in one line, then 1 or 2 clear examples, then a quick tip if useful. When the student shares a sentence, show a corrected or tighter version and say why in one line. Sound natural and warm. Never start with “Great question”, never use headings, and never write robotic phrases like “As an AI” or “I hope this helps”. Use **bold** sparingly for key words only; avoid bullet-heavy lists. If a doubt is not about English, grammar or writing, gently say you only help with English and steer back with a relevant idea. If unsure, say so honestly instead of guessing. If someone sincerely asks, you may say you are an AI tutor.`;
async function send(e){
  if(e)e.preventDefault();const v=qi.value.trim();if(!v||busy)return;
  qi.value="";cps.style.display="none";add("u",v);hist.push({role:"user",content:v});
  if(!sample){await getSample();if(!sample){add("b","Verba isn’t available in this view. Open the shared link in claude.ai and try again.");hist.pop();return}}
  busy=true;$("sb").disabled=true;const bub=add("b","…");
  const convo=hist.slice(-10).map(m=>(m.role==="user"?"Student: ":"Verba: ")+m.content).join("\n");
  try{
    const r=await sample(SYS+"\n\nConversation so far:\n"+convo+"\n\nWrite only Verba’s next reply.",{cache:false,onText:({text})=>{bub.innerHTML=fmt(text||"…");msgs.scrollTop=msgs.scrollHeight}});
    bub.innerHTML=fmt(r.text);hist.push({role:"assistant",content:r.text});
  }catch(err){
    bub.textContent=err&&err.code==="rate_limited"?"Too many questions at once. Wait a few seconds and try again.":err&&err.code==="not_granted"?"Permission was declined, so I can’t answer. Tap Send again and allow it.":"Something went wrong. Please try once more.";hist.pop();
  }
  busy=false;$("sb").disabled=false;
}
